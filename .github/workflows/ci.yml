name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            python-version: "3.11.0"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: ubuntu-latest
            python-version: "3.15"
          - os: windows-latest
            python-version: "3.15"
          - os: macos-latest
            python-version: "3.15"
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Check the vendored spec
        run: python scripts/sync_spec.py --check

      - name: Type-check (mypy)
        run: python -m mypy

      - name: Type-check (pyright)
        run: python -m pyright

      - name: Lint
        run: python -m ruff check .

      - name: Test
        run: python -m pytest

      - name: Build
        run: python -m build --no-isolation

      - name: Check the package metadata
        run: python -m twine check --strict dist/*

      - name: Check the distribution contents
        run: python scripts/check_wheel_contents.py dist

  lowest-dependencies:
    name: Python 3.11.0 with the lowest dependency versions
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.11.0
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11.0"

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Install the lowest allowed runtime dependencies
        run: python -m pip install "httpx==0.28.1" "pydantic==2.10.0"

      - name: Test
        run: python -m pytest

  release-install:
    name: Release install and build on Python 3.12
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install the release requirements
        run: 'python -m pip install --require-hashes --only-binary :all: -r requirements-release.txt'

      - name: Build
        run: python -m build --no-isolation

      - name: Check the package metadata
        run: python -m twine check --strict dist/*

      - name: Check the distribution contents
        run: python scripts/check_wheel_contents.py dist
