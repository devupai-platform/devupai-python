[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "devupai"
dynamic = ["version"]
description = "Official Python SDK for the DEVUP AI API, with billing in DZD."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "DEVUP AI" }]
keywords = ["devupai", "devup", "ai", "api", "sdk", "llm", "inference", "embeddings", "algeria", "dzd"]
dependencies = [
    "httpx>=0.28.1,<1",
    "pydantic>=2.10,<3",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/devupai-platform/devupai-python#readme"
Repository = "https://github.com/devupai-platform/devupai-python"
Issues = "https://github.com/devupai-platform/devupai-python/issues"
Changelog = "https://github.com/devupai-platform/devupai-python/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/devupai/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/devupai"]

[tool.hatch.build.targets.sdist]
include = [
    "/src/devupai",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
    "/pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests", "scripts"]
addopts = "-ra --strict-markers --strict-config"
xfail_strict = true

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src", "scripts", "tests/type_checks", "examples"]

[tool.pyright]
include = ["src", "scripts", "tests/type_checks", "examples"]
typeCheckingMode = "strict"
pythonVersion = "3.11"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["devupai"]
